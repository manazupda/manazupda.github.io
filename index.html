<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Misha!</title>
<style>
  :root { --scroll-length: 900vh; }            /* длина страницы: больше = медленнее видео */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0d12; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Высокая «дорожка» скролла. Внутри — липкий экран с видео */
  .track { height: var(--scroll-length); position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.45), transparent 35%); }

  /* Подпись главы */
  .chapter { position: absolute; z-index: 2; left: 20px; top: calc(20px + env(safe-area-inset-top, 0px));
    font: 600 13px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase;
    text-shadow: 0 1px 6px rgba(0,0,0,.7); max-width: 60vw; transition: opacity .35s, transform .35s; }
  .chapter.hide { opacity: 0; transform: translateY(-6px); }

  /* Крупный заголовок сцены */
  .caption { position: absolute; z-index: 2; left: 20px; right: 20px; bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    font-size: clamp(22px, 4.5vw, 44px); font-weight: 700; line-height: 1.15;
    text-shadow: 0 2px 14px rgba(0,0,0,.65); transition: opacity .4s, transform .4s; }
  .caption.hide { opacity: 0; transform: translateY(12px); }

  /* Прогресс и подсказка */
  .progress { position: absolute; z-index: 3; left: 0; top: 0; height: 3px; width: 100%;
    transform-origin: left; transform: scaleX(0); background: #ff8a3d; }
  .hint { position: absolute; z-index: 3; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); font-size: 13px; opacity: .85; transition: opacity .4s; }
  .hint.hide { opacity: 0; }
  .hint span { display: inline-block; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(5px); } }

  .loader { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: #0b0d12; font-size: 14px; transition: opacity .5s; }
  .loader.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="loader" id="loader">Загрузка…</div>

<div class="track" id="track">
  <div class="stage">
    <video id="v" muted playsinline preload="auto" disablepictureinpicture></video>
    <div class="progress" id="bar"></div>
    <div class="chapter" id="chapter"></div>
    <div class="caption" id="caption"></div>
    <div class="hint" id="hint"><span>↓</span> листайте вниз</div>
  </div>
</div>

<script>
/* ---------- Настройки ---------- */
// Сцены: [начало, конец (сек видео), подпись главы, заголовок на экране]
const SCENES = [
  [0.0,  1.2,  "",                              ""],
  [1.2,  6.0,  "01. Finding the right box",     "Ищем ту самую коробку"],
  [6.0,  8.3,  "02. In the air",                "Из Санкт-Петербурга в Белград"],
  [8.3,  10.3, "03. Delivery",                  "Посылка прибыла"],
  [10.3, 12.2, "04. Unboxing",                  "Что внутри?"],
  [12.2, 13.3, "05. The list",                  ""],
  [13.3, 14.5, "06. Welcome committee",         ""],
  [14.5, 16.2, "",                              "Happy Birthday, Misha!"],
];
const SMOOTHING = 0.12;   // 0.05 — очень плавно/«тяжело», 0.3 — почти мгновенно

/* ---------- Код ---------- */
const v = document.getElementById('v');
const track = document.getElementById('track');
const bar = document.getElementById('bar');
const chapterEl = document.getElementById('chapter');
const captionEl = document.getElementById('caption');
const hint = document.getElementById('hint');
const loader = document.getElementById('loader');

let duration = 0, target = 0, current = 0, lastSet = -1, sceneIdx = -1;

function progress() {
  const max = track.offsetHeight - window.innerHeight;
  return Math.min(1, Math.max(0, window.scrollY / max));
}

function showScene(i) {
  if (i === sceneIdx) return;
  sceneIdx = i;
  const [, , ch, cap] = SCENES[i];
  for (const [el, txt] of [[chapterEl, ch], [captionEl, cap]]) {
    el.classList.add('hide');
    setTimeout(() => {
      if (sceneIdx !== i) return;
      el.textContent = txt;
      if (txt) el.classList.remove('hide');
    }, 180);
  }
}

function tick() {
  const p = progress();
  target = p * duration;
  current += (target - current) * SMOOTHING;           // плавное догоняние скролла
  if (Math.abs(target - current) < 0.001) current = target;

  // не дёргаем seek без нужды (шаг ≈ 1 кадр при 30 fps)
  if (Math.abs(current - lastSet) > 1 / 60) {
    v.currentTime = Math.min(current, duration - 0.001);
    lastSet = current;
  }

  bar.style.transform = `scaleX(${p})`;
  hint.classList.toggle('hide', p > 0.02);
  const i = SCENES.findIndex(s => current >= s[0] && current < s[1]);
  showScene(i === -1 ? SCENES.length - 1 : i);

  requestAnimationFrame(tick);
}

let started = false;
function start() {
  if (started) return;
  started = true;
  duration = v.duration || 16.2;
  loader.classList.add('done');
  v.pause();
  requestAnimationFrame(tick);
}

// Скачиваем видео целиком (с процентами) и отдаём его в <video> как blob —
// так перемотка работает мгновенно и на любом сервере.
async function load() {
  const src = 'scroll.mp4';
  v.addEventListener('loadeddata', start, { once: true });
  v.addEventListener('loadedmetadata', () => { if (v.readyState >= 2) start(); }, { once: true });
  v.addEventListener('error', () => { loader.textContent = 'Не удалось загрузить scroll.mp4 — положите его рядом с index.html'; });
  try {
    const res = await fetch(src);
    if (!res.ok) throw new Error(res.status);
    const total = +res.headers.get('Content-Length') || 0;
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (total) loader.textContent = 'Загрузка… ' + Math.round(got / total * 100) + '%';
    }
    v.src = URL.createObjectURL(new Blob(chunks, { type: 'video/mp4' }));
  } catch (e) {
    v.src = src;              // запасной путь (например, при открытии файла напрямую)
  }
  v.load();
  setTimeout(start, 4000);    // на крайний случай не держим экран загрузки вечно
}
load();

// iOS/Safari: «прогрев» видео первым касанием
window.addEventListener('touchstart', () => { v.play().then(() => v.pause()).catch(() => {}); }, { once: true, passive: true });
</script>
</body>
</html>
